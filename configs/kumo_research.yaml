seed: 42

experiment:
  inputs:
    - data/raw/entsoe_prices_20200101_20210101.parquet
    - data/raw/entsoe_prices_20210101_20220101.parquet
    - data/raw/entsoe_prices_20220101_20230101.parquet
    - data/raw/entsoe_prices_2023.parquet
    - data/raw/entsoe_prices_2024.parquet
  development_dates:
    - "2023-05-28"
    - "2023-08-10"
    - "2023-10-29"
    - "2023-11-15"
  retrospective_test_start: "2024-01-01T00:00:00Z"
  spike_quantile: 0.99
  bootstrap_samples: 200
  minimum_gate_days: 20
  cache_dir: artifacts/kumo_cache
  output: results/kumo_development_diagnostic

kumo:
  seq_len: 512
  model_horizon: 72
  checkpoint: run8_best_model_cr.pt
  standardizer: standardizer.pkl
  model_name: AutonLab/MOMENT-1-large
  use_cross_channel: true
  device: null
  seed: 42
  batch_size: 1
  num_workers: 0
  alpha: 0.20
  k: 16
  temperature: 0.05
  context_stride: 24
  local_files_only: false

native_darr:
  # Enable only after the direct official-checkpoint smoke test passes. DARR rebuilds
  # a large embedding archive for each information vintage and is expensive on 4 GB VRAM.
  enabled: false

external_retrieval:
  context_hours: 168
  k: 10
  temperature: 0.10
  minimum_regime_neighbors: 3
  direct_weight: 0.50
  # These provisional thresholds are locked before the diagnostic. The full study must
  # replace them with thresholds fitted only on development snapshots.
  thresholds:
    negative_price_share: 0.02
    volatility_eur_mwh: 20.0
    residual_load_mw: null
    renewable_share: null

battery:
  power_mw: 1.0
  energy_mwh: 2.0
  min_soc_fraction: 0.10
  max_soc_fraction: 0.90
  initial_soc_fraction: 0.50
  charge_efficiency: 0.95
  discharge_efficiency: 0.95
  degradation_cost_eur_per_mwh: 5.0
  max_equivalent_cycles_per_day: 1.5

optimization:
  terminal_value_eur_per_mwh: 50.0
  risk_aversion: 0.20
  cvar_alpha: 0.95
  solver: HIGHS
