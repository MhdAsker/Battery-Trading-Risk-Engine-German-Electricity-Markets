[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "german-bess-trading"
version = "0.3.0"
description = "Research-grade German electricity forecasting and BESS trading backtest"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "cvxpy>=1.4,<1.7",
  "httpx>=0.27,<1",
  "highspy>=1.7,<2",
  "numpy>=1.26,<2",
  "pandas>=2.1,<3",
  "pyarrow>=15,<24",
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
models = ["lightgbm>=4.3,<5", "xgboost>=2.0,<3"]
dashboard = ["plotly>=5.20,<7", "streamlit>=1.32,<2"]
visualization = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.4,<1", "mypy>=1.9,<2"]

[project.scripts]
bess-research = "bess_trading.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bess_trading"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
